<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0B57D0"/>
  <meta name="description" content="OmnishPilot schedules agent jobs, tracks runs, and notifies you when work finishes."/>
  <title>OmnishPilot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="/favicon.ico" sizes="32x32"/>
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16"/>
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="sidebar__brand">
        <img class="brand-mark" src="/logo.svg" alt="" aria-hidden="true" width="40" height="40"/>
        <div>
          <div class="brand-title">OmnishPilot</div>
          <p class="brand-sub">Agent job control</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="sidebar-nav__item active" data-tab="home">
          <span class="nav-icon" aria-hidden="true">⌂</span>
          <span>Overview</span>
        </button>
        <button type="button" class="sidebar-nav__item" data-tab="calendar">
          <span class="nav-icon" aria-hidden="true">📅</span>
          <span>Calendar</span>
        </button>
        <button type="button" class="sidebar-nav__item" data-tab="timeline">
          <span class="nav-icon" aria-hidden="true">▦</span>
          <span>Timeline</span>
        </button>
        <button type="button" class="sidebar-nav__item" data-tab="compose">
          <span class="nav-icon" aria-hidden="true">✎</span>
          <span>Compose</span>
        </button>
        <button type="button" class="sidebar-nav__item" data-tab="settings">
          <span class="nav-icon" aria-hidden="true">⚙</span>
          <span>Settings</span>
        </button>
      </nav>
      <button type="button" class="btn btn-filled sidebar__cta" id="btn-add-work-sidebar">New job</button>
    </aside>

    <div class="content-column">
      <header class="top-app-bar" role="banner">
        <div class="top-app-bar__row">
          <div class="top-app-bar__brand top-app-bar__brand--mobile">
            <img class="brand-mark" src="/logo.svg" alt="" aria-hidden="true" width="32" height="32"/>
            <div>
              <p class="brand-title">OmnishPilot</p>
            </div>
          </div>
          <h1 class="page-title" id="page-title">Overview</h1>
          <button type="button" class="btn btn-filled top-app-bar__action" id="btn-add-work">New job</button>
        </div>
        <div class="quick-add-bar">
          <span class="quick-add-bar__icon" aria-hidden="true">✨</span>
          <input type="text" id="quick-add-input" class="quick-add-bar__input" placeholder="What do you want done, and when? e.g. agent work, or &quot;Every night at 2am run ./backup.sh&quot;" autocomplete="off"/>
          <button type="button" class="icon-btn" id="quick-add-folder-toggle" title="Attach a folder (optional)" aria-label="Attach a folder">📁</button>
          <button type="button" class="btn btn-filled sm quick-add-bar__go" id="quick-add-go">Go</button>
        </div>
        <div class="quick-add-folder-row hidden" id="quick-add-folder-row"></div>
        <div id="quick-add-result"></div>
      </header>

      <main id="main" class="main-content" role="main"></main>
    </div>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" class="bottom-nav__item active" data-tab="home">
        <span class="bottom-nav__icon" aria-hidden="true">⌂</span>
        <span class="bottom-nav__label">Overview</span>
      </button>
      <button type="button" class="bottom-nav__item" data-tab="calendar">
        <span class="bottom-nav__icon" aria-hidden="true">📅</span>
        <span class="bottom-nav__label">Calendar</span>
      </button>
      <button type="button" class="bottom-nav__item" data-tab="timeline">
        <span class="bottom-nav__icon" aria-hidden="true">▦</span>
        <span class="bottom-nav__label">Timeline</span>
      </button>
      <button type="button" class="bottom-nav__item" data-tab="compose">
        <span class="bottom-nav__icon" aria-hidden="true">✎</span>
        <span class="bottom-nav__label">Compose</span>
      </button>
      <button type="button" class="bottom-nav__item" data-tab="settings">
        <span class="bottom-nav__icon" aria-hidden="true">⚙</span>
        <span class="bottom-nav__label">Settings</span>
      </button>
    </nav>

    <button type="button" class="fab" id="fab-add-work" aria-label="Create new job">
      <span aria-hidden="true">+</span>
    </button>
  </div>

  <div class="modal hidden" id="wizard-modal" role="dialog" aria-modal="true" aria-labelledby="wizard-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="wizard-title">New job</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div class="wizard-steps" id="wizard-steps" aria-hidden="true"></div>
      <div class="modal-body" id="wizard-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-text" id="wizard-back" hidden>Back</button>
        <button type="button" class="btn btn-filled" id="wizard-next">Continue</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel sheet wide">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="task-modal-title">Job</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="task-modal-body"></div>
    </div>
  </div>

  <div class="modal hidden" id="import-modal" role="dialog" aria-modal="true" aria-labelledby="import-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel sheet wide">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="import-title">Import jobs</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="import-modal-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-text" data-close>Cancel</button>
        <button type="button" class="btn btn-filled" id="import-submit">Import</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="new-campaign-modal" role="dialog" aria-modal="true" aria-labelledby="new-campaign-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel sheet wide">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="new-campaign-title">New campaign</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="new-campaign-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-text" data-close>Cancel</button>
        <button type="button" class="btn btn-filled" id="new-campaign-submit">Create campaign</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="cal-quick-add-modal" role="dialog" aria-modal="true" aria-labelledby="cal-quick-add-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="cal-quick-add-title">Schedule job</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <p class="section-lead" id="cal-quick-add-when">Pick a time on the calendar timeline.</p>
        <div class="field">
          <label for="cal-quick-add-title-input">Job title</label>
          <input type="text" id="cal-quick-add-title-input" placeholder="Weekly report, deploy check…" autocomplete="off"/>
        </div>
        <div class="field">
          <label for="cal-quick-add-template">Job type</label>
          <select id="cal-quick-add-template"></select>
        </div>
        <div class="field">
          <label>How should it run?</label>
          <div class="mode-chips" id="cal-quick-add-modes"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-text" data-close>Cancel</button>
        <button type="button" class="btn btn-filled" id="cal-quick-add-submit">Create job</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="path-picker-modal" role="dialog" aria-modal="true" aria-labelledby="path-picker-title">
    <div class="modal-backdrop" data-close-picker></div>
    <div class="modal-panel sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="path-picker-title">Choose a folder</h2>
        <button type="button" class="icon-btn" data-close-picker aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="path-picker-input">Path</label>
          <input type="text" id="path-picker-input" autocomplete="off"/>
        </div>
        <div class="path-crumbs" id="path-picker-crumbs"></div>
        <div class="path-list" id="path-picker-list"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-text" id="path-picker-new-folder" style="margin-right: auto;">New folder</button>
        <button type="button" class="btn btn-text" data-close-picker>Cancel</button>
        <button type="button" class="btn btn-filled" id="path-picker-select">Use this folder</button>
      </div>
    </div>
  </div>
  <div class="modal hidden" id="new-folder-modal" role="dialog" aria-modal="true" aria-labelledby="new-folder-title">
    <div class="modal-backdrop" data-close-new-folder></div>
    <div class="modal-panel sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <h2 id="new-folder-title">Create new folder</h2>
        <button type="button" class="icon-btn" data-close-new-folder aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="new-folder-input">Folder name</label>
          <input type="text" id="new-folder-input" autocomplete="off" placeholder="e.g. my-folder"/>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-text" data-close-new-folder>Cancel</button>
        <button type="button" class="btn btn-filled" id="new-folder-submit">Create</button>
      </div>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <nav id="cal-context-menu" class="cal-context-menu hidden" role="menu" aria-label="Timeline actions"></nav>
  <script src="/app.js"></script>
</body>
</html>
