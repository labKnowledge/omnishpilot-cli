<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0B57D0"/>
  <title>Sign in — OmnishPilot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="/favicon.ico" sizes="32x32"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #FEF7FF;
      --surface: #FFFFFF;
      --primary: #0B57D0;
      --on-primary: #FFFFFF;
      --text: #1C1B1F;
      --muted: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141218;
        --surface: #1D1B20;
        --primary: #A8C7FA;
        --on-primary: #062E6F;
        --text: #E6E1E5;
        --muted: #CAC4D0;
        --outline: #938F99;
        --error: #F2B8B5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: min(400px, 100%);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 500;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--outline);
      border-radius: 12px;
      font: inherit;
      background: var(--surface);
      color: var(--text);
    }
    input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 16px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    .error {
      margin-top: 12px;
      color: var(--error);
      font-size: 0.875rem;
      min-height: 1.25rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img class="brand-mark" src="/logo.svg" alt="" aria-hidden="true" width="36" height="36"/>
      <div>
        <h1>OmnishPilot</h1>
      </div>
    </div>
    <p>This control plane is password protected. Sign in to manage scheduled agent jobs.</p>
    <form id="login-form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus/>
      <button type="submit" id="submit-btn">Sign in</button>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </form>
    <p style="margin:16px 0 0;font-size:0.8rem;color:var(--muted);line-height:1.4">
      Set or reset the password on this machine:<br/>
      <code style="font-size:0.78rem">omnishpilot password set 'your-secret'</code>
      then <code style="font-size:0.78rem">omnishpilot restart</code>
    </p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';

    async function checkAlreadyIn() {
      try {
        const r = await fetch('/api/auth/status');
        const j = await r.json();
        if (j.authenticated) location.replace(next);
      } catch { /* stay on login */ }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error');
      const password = document.getElementById('password').value;
      btn.disabled = true;
      err.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          err.textContent = j.error === 'invalid_password' ? 'Wrong password' : (j.error || 'Sign in failed');
          btn.disabled = false;
          return;
        }
        location.replace(next.startsWith('/') ? next : '/');
      } catch {
        err.textContent = 'Could not reach the server';
        btn.disabled = false;
      }
    });

    checkAlreadyIn();
  </script>
</body>
</html>
