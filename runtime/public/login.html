<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#f4f6f8"/>
  <title>OmnishPilot — Sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #1a2332;
      --muted: #5c6b7a;
      --line: #d7dee7;
      --accent: #1f6feb;
      --fail: #c62828;
      --ok: #2e7d32;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(26, 35, 50, 0.06);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand img { width: 36px; height: 36px; }
    .brand h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; }
    .brand p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: 500 0.95rem/1.3 var(--mono);
      color: var(--text);
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
    }
    button {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      font: 600 0.95rem/1.2 var(--font);
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg {
      margin-top: 12px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
    .msg.err { color: var(--fail); }
    .msg.ok { color: var(--ok); }
    .hint {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .hint code {
      font-family: var(--mono);
      font-size: 0.76rem;
      background: #eef2f6;
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/logo.svg" alt="" width="36" height="36"/>
      <div>
        <h1>OmnishPilot</h1>
        <p>Sign in to the control plane</p>
      </div>
    </div>
    <form id="login-form" autocomplete="current-password">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus placeholder="Enter password"/>
      <button type="submit" id="submit">Sign in</button>
      <p class="msg" id="msg" role="status"></p>
    </form>
    <p class="hint">
      Forgot or never set a password? On this machine run:<br/>
      <code>omnishpilot password set 'your-secret'</code><br/>
      Then <code>omnishpilot restart</code>
    </p>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('password');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          msg.textContent = data.error === 'invalid_password' ? 'Incorrect password.' : (data.error || 'Sign-in failed');
          msg.classList.add('err');
          return;
        }
        msg.textContent = 'Signed in.';
        msg.classList.add('ok');
        location.href = next;
      } catch (err) {
        msg.textContent = err.message || 'Network error';
        msg.classList.add('err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
